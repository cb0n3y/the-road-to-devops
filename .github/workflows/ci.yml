name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-trailing:
    name: Lint Trailing Whitespace
    uses: cb0n3y/ci-templates/.github/workflows/lint-trailing.yml@main

  lint-vagrant:
    name: Lint Vagrantfiles
    uses: cb0n3y/ci-templates/.github/workflows/lint-vagrant.yml@main

  lint-bash:
    name: Lint Bash Scripts
    uses: cb0n3y/ci-templates/.github/workflows/lint-bash.yml@main

  lint-yaml:
    name: Lint YAML Files
    uses: cb0n3y/ci-templates/.github/workflows/lint-yaml.yml@main

  secret-detection:
    name: Secret Detection
    uses: cb0n3y/ci-templates/.github/workflows/secret-detection.yml@main
