---
name: CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - dev

jobs:
  lint-trailing:
    name: Lint Trailing Whitespace
    uses: cb0n3y/ci-templates/.github/workflows/lint-trailing.yml@v1.0.0-lint-trailing

  lint-vagrant:
    name: Lint Vagrantfiles
    uses: cb0n3y/ci-templates/.github/workflows/lint-vagrant.yml@v1.0.0-lint-vagrant

  lint-bash:
    name: Lint Bash Scripts
    uses: cb0n3y/ci-templates/.github/workflows/lint-bash.yml@v1.0.0-lint-bash

  lint-yaml:
    name: Lint YAML Files
    uses: cb0n3y/ci-templates/.github/workflows/lint-yaml.yml@v1.0.0

  secret-detection:
    name: Secret Detection
    uses: cb0n3y/ci-templates/.github/workflows/secret-detection.yml@main
